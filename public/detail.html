<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c0d0f" />
  <meta name="description" content="Event Watch entry details." />
  <meta name="robots" content="noindex" />
  <title>Details | Event Watch</title>
  <script>
    (() => {
      const theme = localStorage.getItem('event-watch-theme') || 'dark';
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]')
        ?.setAttribute('content', theme === 'dark' ? '#0c0d0f' : '#f4f4f1');
    })();
  </script>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="detail-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Event Watch home">Event Watch<span class="dot">.</span></a>
      <div class="top-actions">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Switch theme">
          <span class="theme-icon" aria-hidden="true">☀</span>
          <span id="themeLabel">Light</span>
        </button>
        <button id="logoutButton" class="link-button" type="button">Sign out</button>
      </div>
    </header>

    <main class="detail-main">
      <a class="detail-back" href="/">← Back to watches</a>
      <div id="detailLoading" class="detail-loading">Loading details…</div>
      <section id="detailView" class="hidden" aria-live="polite"></section>
    </main>

    <footer>
      <span>Event Watch</span>
      <span>Detailed watch information and controls.</span>
    </footer>
  </div>
  <script type="module" src="/detail.js"></script>
</body>
</html>
