<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0c0d0f" />
  <title>Event Watch — Offline</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c0d0f; color: #f5f7f8; }
    main { width: min(32rem, calc(100% - 3rem)); }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 8vw, 3.5rem); line-height: 1; }
    p { margin: 0; color: #b7bdc5; line-height: 1.6; }
    .offline-brand { display: inline-flex; align-items: center; gap: .8rem; }
    .brand-mark { width: .85em; height: .85em; flex: 0 0 auto; background: #cdb4ff; -webkit-mask: url("/icons/event-watch-logo.svg?v=3") center / contain no-repeat; mask: url("/icons/event-watch-logo.svg?v=3") center / contain no-repeat; }
  </style>
</head>
<body>
  <main>
    <h1 class="offline-brand"><span class="brand-mark" aria-hidden="true"></span><span>Event Watch</span></h1>
    <p>You’re offline. Reconnect to check event availability and manage your watches.</p>
  </main>
</body>
</html>
